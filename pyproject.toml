[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b4-maintainer"
version = "0.1.dev0"
description = "Mailing-list maintainer workspace built on b4"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["COPYING"]
requires-python = ">=3.11"
# b4 and liblore install from the pinned submodules; see deps/README.md.
dependencies = [
    "b4[tui]",
    "liblore>=0.10.1",
    "textual>=1.0",
]

[project.scripts]
b4-maintainer = "b4_maintainer.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
b4_maintainer = ["sessions/profiles/*.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["deps"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B007", "B904", "DTZ", "I"]

[tool.ruff.format]
quote-style = "single"
